[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "datafooding-sessionlog"
version = "0.1.0"
description = "One deterministic, reversible record for agent sessions and workspace evidence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Environment Foundry"}]
dependencies = []

[project.scripts]
sessionlog = "sessionlog.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "jsonschema>=4.23,<5", "ruff>=0.12,<1", "hypothesis>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/sessionlog"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
